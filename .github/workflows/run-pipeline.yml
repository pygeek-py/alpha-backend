# Free-tier substitute for Celery beat + a worker (neither has a free plan
# anywhere -- see ARCHITECTURE.md's deployment notes). This calls
# /api/v1/pipeline/run/, which runs the entire pipeline once,
# synchronously, in-process on the web service itself -- no broker, no
# worker needed. Swap this out for real Celery beat + worker services
# whenever those get added; this workflow can just be deleted then.
#
# SCHEDULE MOVED to cron-job.org (every 2 min -- GitHub Actions' effective
# ~15 min reliability floor was too coarse; see ARCHITECTURE.md S5.1). Do
# NOT re-enable the `schedule:` trigger below while cron-job.org is also
# calling this endpoint -- two schedulers hitting it independently risks
# overlapping pipeline runs. workflow_dispatch stays for manual testing.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ALPHA_BACKEND_URL  e.g. https://alpha-backend.onrender.com  (no trailing slash)
#   ALPHA_API_TOKEN    a DRF auth token for the operator account
name: Run pipeline

on:
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline run
        run: |
          curl --fail-with-body --max-time 180 \
            -X POST \
            -H "Authorization: Token ${{ secrets.ALPHA_API_TOKEN }}" \
            -w "\nHTTP status: %{http_code}\n" \
            "${{ secrets.ALPHA_BACKEND_URL }}/api/v1/pipeline/run/"
