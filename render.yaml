# Render Blueprint (render.yaml) for the Solana Memecoin Intelligence &
# Alert Engine backend: one web service (Django/gunicorn), two background
# workers (Celery worker + beat -- both need to run continuously for the
# system to do anything on its own, see ARCHITECTURE.md S5), managed
# Postgres, and managed Redis.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Render will read this file and provision everything below. Env vars
# marked `sync: false` must be filled in by hand in the Render dashboard
# after the first deploy (secrets are never committed to this file).
#
# The three services share one env var list via a plain YAML anchor
# (`&shared-env` / `*shared-env`) rather than Render's `envVarGroups`
# service field, which doesn't exist in their schema (confirmed against a
# real deploy attempt: "field envVarGroups not found in type file.Service").
# A YAML anchor is resolved by the YAML parser itself before Render ever
# sees the file, so this can't hit the same kind of schema-drift error --
# Render just sees three services each with a fully-expanded envVars list.

services:
  - type: web
    name: alpha-backend
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/v1/health/
    envVars: &shared-env
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Your Render web service's hostname, e.g. alpha-backend.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # Your Vercel frontend's URL, e.g. https://alpha-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: alpha-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: alpha-redis
          property: connectionString
      # Real data providers -- see .env.example for what each accepts.
      - key: SOLANA_CHAIN_DATA_PROVIDER
        value: birdeye_quicknode
      - key: SOLANA_MARKET_DATA_PROVIDER
        value: birdeye
      - key: SOLANA_WALLET_DATA_PROVIDER
        value: mock
      - key: SOCIAL_DATA_PROVIDER
        value: none
      - key: BIRDEYE_API_KEY
        sync: false
      - key: QUICKNODE_RPC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  - type: worker
    name: alpha-celery-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements/prod.txt"
    # All queues on one worker (ingestion/analysis/alerts/ml) -- splitting
    # into per-queue services is a later scaling step, not needed yet.
    startCommand: "celery -A config worker -l info --concurrency=2"
    envVars: *shared-env

  - type: worker
    name: alpha-celery-beat
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements/prod.txt"
    startCommand: "celery -A config beat -l info"
    envVars: *shared-env

  - type: redis
    name: alpha-redis
    plan: starter
    ipAllowList: []

databases:
  - name: alpha-db
    plan: starter
    databaseName: alpha
    user: alpha
